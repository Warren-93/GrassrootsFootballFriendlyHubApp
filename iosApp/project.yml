name: iosApp

options:
  bundleIdPrefix: com.gffh.mobile

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
    # The version people see, and the build number - every upload to App
    # Store Connect needs a new one. The TestFlight workflow passes both
    # (0.1.0, like Android, and its run number) on the xcodebuild line.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Google OAuth iOS client ID for "Continue with Google". Empty: the
    # app offers only Apple. The TestFlight workflow fills it from the
    # repository variable GOOGLE_IOS_CLIENT_ID.
    GFFH_GOOGLE_IOS_CLIENT_ID: ""

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    # The shared framework is static, so the app links the system frameworks
    # its Kotlin code uses. PhotosUI is the team badge picker's
    # (PHPickerViewController) and AuthenticationServices is Sign in with
    # Apple's (core/auth/SocialSignIn.ios.kt); nothing in the Swift code
    # imports either.
    dependencies:
      - sdk: PhotosUI.framework
      - sdk: AuthenticationServices.framework
    # Push notifications: the development (sandbox) APNs environment, which
    # is what a build run from Xcode uses. When an archive is exported for
    # TestFlight or the App Store, Xcode switches this to "production" from
    # the distribution profile.
    # Sign in with Apple: the bundle ID needs the Sign in with Apple
    # capability in the Apple developer account too (see the README).
    # Simulator builds sign nothing, so both are inert there.
    entitlements:
      path: Generated/iosApp.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Kickabout
        CFBundleName: Kickabout
        # XcodeGen's defaults are a fixed 1.0 (1), which App Store Connect
        # would refuse from the second upload on.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GFFHApiBaseUrl: $(GFFH_API_BASE_URL)
        GFFHGoogleIosClientId: $(GFFH_GOOGLE_IOS_CLIENT_ID)
        # HTTPS only, which is exempt from export compliance: this answers
        # App Store Connect's encryption question for every build.
        ITSAppUsesNonExemptEncryption: false
        # Lets a push wake the app to refresh in the background.
        UIBackgroundModes:
          - remote-notification
        # Lets a Debug build talk to a backend on the Mac over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Compose Multiplatform's own startup sanity check throws a hard
        # crash without this key (ProMotion/high-refresh-rate support) - see
        # androidx.compose.ui.uikit.PlistSanityCheck.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        # Permanent once registered with Apple. Mirrors Android's
        # com.gffh.mobile.android; the API's APPLE_BUNDLE_ID and
        # APNS_BUNDLE_ID must be this too.
        PRODUCT_BUNDLE_IDENTIFIER: com.gffh.mobile.ios
        PRODUCT_NAME: iosApp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          GFFH_API_BASE_URL: "http://localhost:8090"
        Release:
          GFFH_API_BASE_URL: "https://grassrootsfootballfriendlyhubapi.onrender.com"
    prebuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pgffh.enableIos=true
        basedOnDependencyAnalysis: false
