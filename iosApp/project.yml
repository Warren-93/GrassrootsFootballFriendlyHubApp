name: iosApp

options:
  bundleIdPrefix: com.gffh.mobile

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    # The shared framework is static, so the app links the system frameworks
    # its Kotlin code uses. PhotosUI is the team badge picker's
    # (PHPickerViewController); nothing in the Swift code imports it.
    dependencies:
      - sdk: PhotosUI.framework
    # Push notifications: the development (sandbox) APNs environment, which
    # is what a build run from Xcode uses. When an archive is exported for
    # TestFlight or the App Store, Xcode switches this to "production" from
    # the distribution profile. Simulator builds sign nothing, so this is
    # inert there.
    entitlements:
      path: Generated/iosApp.entitlements
      properties:
        aps-environment: development
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Kickabout
        GFFHApiBaseUrl: $(GFFH_API_BASE_URL)
        # Lets a push wake the app to refresh in the background.
        UIBackgroundModes:
          - remote-notification
        # Lets a Debug build talk to a backend on the Mac over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Compose Multiplatform's own startup sanity check throws a hard
        # crash without this key (ProMotion/high-refresh-rate support) - see
        # androidx.compose.ui.uikit.PlistSanityCheck.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gffh.mobile.iosApp
        PRODUCT_NAME: iosApp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          GFFH_API_BASE_URL: "http://localhost:8090"
        Release:
          GFFH_API_BASE_URL: "https://grassrootsfootballfriendlyhubapi.onrender.com"
    prebuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pgffh.enableIos=true
        basedOnDependencyAnalysis: false
