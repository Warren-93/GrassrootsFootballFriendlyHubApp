name: iosApp

options:
  bundleIdPrefix: com.gffh.mobile

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iosApp
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GFFH
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gffh.mobile.iosApp
        PRODUCT_NAME: iosApp
        TARGETED_DEVICE_FAMILY: "1"
        # Compose Multiplatform's iOS interop (CMPLayoutRegion.o) references
        # UIViewLayoutRegion, a UIKit class newer than this runner's SDK
        # (18.2) has in its linkable stub - Compose's own object file was
        # built assuming SDK 18.5. Compose almost certainly gates real use
        # of it behind a runtime OS-version check, so treat it as weakly
        # resolved instead of a hard link requirement: it'll link fine here
        # and would only matter at runtime on an OS new enough to have it.
        OTHER_LDFLAGS: "$(inherited) -Wl,-U,_OBJC_CLASS_$$_UIViewLayoutRegion"
    prebuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pgffh.enableIos=true
        basedOnDependencyAnalysis: false
