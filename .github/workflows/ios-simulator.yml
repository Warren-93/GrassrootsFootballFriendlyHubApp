name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-simulator.yml'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Select latest available Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Find an available iOS Simulator device
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -m1 -E '^[[:space:]]+iPhone' | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "Using simulator device: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath iosApp/build \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app for Appetize.io
        run: |
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r GFFH-Simulator.zip iosApp.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFFH-iOS-Simulator-Build
          path: iosApp/build/Build/Products/Debug-iphonesimulator/GFFH-Simulator.zip
