name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package,
          # which current sdkmanager no longer offers ("Failed to find
          # package 'tools'"); Gradle installs the platforms it needs itself.
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run shared module unit tests
        run: ./gradlew :shared:testAndroidHostTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: shared/build/test-results/testAndroidHostTest/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFFH-Android-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
