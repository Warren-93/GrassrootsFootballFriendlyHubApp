name: Android Release Bundle

# Builds the signed .aab to upload to Google Play.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.2.0.
# Pull requests that touch the app build an unsigned bundle, only to prove
# the release build still compiles.
#
# Signing needs these repository secrets (Settings > Secrets and variables
# > Actions):
#   ANDROID_KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   ANDROID_KEY_ALIAS          the upload key's alias
#   ANDROID_KEY_PASSWORD       the upload key's password

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must be higher than any bundle already on Play). Blank = this run number + 100.'
        required: false
      version_name:
        description: 'versionName shown to users, e.g. 1.0.0. Blank = 0.1.0.'
        required: false
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which
          # current sdkmanager no longer offers; Gradle fetches platforms itself.
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Work out the version
        id: version
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          # +100 keeps CI builds clear of any versionCode uploaded by hand before.
          CODE="${INPUT_CODE:-$(( GITHUB_RUN_NUMBER + 100 ))}"
          NAME="${INPUT_NAME:-0.1.0}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          echo "versionCode=$CODE versionName=$NAME"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set, so the bundle can't be signed for Play."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew :androidApp:bundleRelease --console=plain
          "-Pgffh.versionCode=$VERSION_CODE"
          "-Pgffh.versionName=$VERSION_NAME"

      - name: Check the bundle is signed
        if: github.event_name != 'pull_request'
        run: |
          AAB=$(ls androidApp/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$AAB" | tee verify.txt
          grep -q "jar verified" verify.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GFFH-Android-Release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
