org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/Native (iOS) toolchain provisioning is expensive in both time and disk
# (several hundred MB per target). This machine builds and verifies the Android
# target only - see gffh-mobile/README.md. Flip this to true on a Mac to add
# the iOS targets and build the iosApp module.
gffh.enableIos=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true

# Kotlin/Native compiler caching hits a known StackOverflowError building a
# cache for Compose Multiplatform's ui-uikitsimarm64 klib (see
# https://kotl.in/disable-native-cache). Caching only helps repeat local
# builds anyway - irrelevant on a fresh CI runner - so just disable it.
kotlin.native.cacheKind=none

