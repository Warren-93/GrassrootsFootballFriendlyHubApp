org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/Native (iOS) toolchain provisioning is expensive in both time and disk
# (several hundred MB per target). This machine builds and verifies the Android
# target only - see gffh-mobile/README.md. Flip this to true on a Mac to add
# the iOS targets and build the iosApp module.
gffh.enableIos=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true

# Kotlin/Native's compiler crashes with "Internal error in body lowering:
# java.lang.StackOverflowError" (in CastsOptimization.buildNullablePredicate)
# building a cache for Compose Multiplatform's ui-uikitsimarm64 klib.
# kotlin.native.cacheKind was the old workaround but was removed in 2.3.20 (a
# no-op now, same crash). This is a plain JVM recursion limit in the
# compiler's own lowering pass, so give its daemon a much bigger stack.
kotlin.daemon.jvmargs=-Xmx4g -Xss16m

